<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1622"/>
      <stop offset="100%" stop-color="#0e2036"/>
    </linearGradient>
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7fd4ff"/>
      <stop offset="100%" stop-color="#3aa0ff"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>

  <!-- connecting lines (fixed network, subtle pulse) -->
  <g stroke="#3aa0ff" stroke-width="1" opacity="0.25">
    <line x1="120" y1="60" x2="300" y2="120"><animate attributeName="opacity" values="0.1;0.4;0.1" dur="4s" repeatCount="indefinite"/></line>
    <line x1="300" y1="120" x2="480" y2="70"><animate attributeName="opacity" values="0.3;0.1;0.3" dur="5s" repeatCount="indefinite"/></line>
    <line x1="480" y1="70" x2="650" y2="150"><animate attributeName="opacity" values="0.1;0.35;0.1" dur="3.5s" repeatCount="indefinite"/></line>
    <line x1="650" y1="150" x2="820" y2="90"><animate attributeName="opacity" values="0.35;0.1;0.35" dur="4.5s" repeatCount="indefinite"/></line>
    <line x1="820" y1="90" x2="980" y2="160"><animate attributeName="opacity" values="0.1;0.3;0.1" dur="3.8s" repeatCount="indefinite"/></line>
    <line x1="980" y1="160" x2="1120" y2="80"><animate attributeName="opacity" values="0.3;0.1;0.3" dur="4.2s" repeatCount="indefinite"/></line>
    <line x1="200" y1="200" x2="380" y2="170"><animate attributeName="opacity" values="0.15;0.35;0.15" dur="5.5s" repeatCount="indefinite"/></line>
    <line x1="380" y1="170" x2="560" y2="210"><animate attributeName="opacity" values="0.35;0.15;0.35" dur="4.8s" repeatCount="indefinite"/></line>
    <line x1="560" y1="210" x2="740" y2="180"><animate attributeName="opacity" values="0.15;0.3;0.15" dur="3.9s" repeatCount="indefinite"/></line>
    <line x1="740" y1="180" x2="920" y2="220"><animate attributeName="opacity" values="0.3;0.15;0.3" dur="4.6s" repeatCount="indefinite"/></line>
    <line x1="920" y1="220" x2="1080" y2="190"><animate attributeName="opacity" values="0.15;0.3;0.15" dur="5.2s" repeatCount="indefinite"/></line>
    <line x1="150" y1="130" x2="300" y2="120"><animate attributeName="opacity" values="0.2;0.4;0.2" dur="4.1s" repeatCount="indefinite"/></line>
    <line x1="480" y1="70" x2="560" y2="210"><animate attributeName="opacity" values="0.1;0.25;0.1" dur="6s" repeatCount="indefinite"/></line>
    <line x1="820" y1="90" x2="740" y2="180"><animate attributeName="opacity" values="0.25;0.1;0.25" dur="5.4s" repeatCount="indefinite"/></line>
  </g>

  <!-- drifting particles -->
  <g fill="url(#dotGlow)">
    <circle cx="120" cy="60" r="3">
      <animateMotion path="M0,0 C 20,15 -15,25 0,40 C 15,55 -20,60 0,80" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="120" r="4">
      <animateMotion path="M0,0 C -25,10 20,20 0,35 C -20,50 25,55 0,70" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="70" r="2.5">
      <animateMotion path="M0,0 C 15,20 -20,30 0,45 C 20,60 -15,65 0,85" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="150" r="3.5">
      <animateMotion path="M0,0 C -20,-15 20,-25 0,-40 C -20,-55 20,-60 0,-80" dur="15s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="90" r="3">
      <animateMotion path="M0,0 C 20,15 -15,25 0,40 C 15,55 -20,60 0,80" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="160" r="4">
      <animateMotion path="M0,0 C -25,10 20,20 0,35 C -20,50 25,55 0,70" dur="17s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1120" cy="80" r="2.5">
      <animateMotion path="M0,0 C 15,20 -20,30 0,45 C 20,60 -15,65 0,85" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="200" r="3">
      <animateMotion path="M0,0 C -20,-15 20,-25 0,-40 C -20,-55 20,-60 0,-80" dur="14.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="170" r="4">
      <animateMotion path="M0,0 C 20,15 -15,25 0,40 C 15,55 -20,60 0,80" dur="16.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="210" r="2.5">
      <animateMotion path="M0,0 C -25,10 20,20 0,35 C -20,50 25,55 0,70" dur="13.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740" cy="180" r="3.5">
      <animateMotion path="M0,0 C 15,20 -20,30 0,45 C 20,60 -15,65 0,85" dur="15.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="920" cy="220" r="3">
      <animateMotion path="M0,0 C -20,-15 20,-25 0,-40 C -20,-55 20,-60 0,-80" dur="12.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="190" r="4">
      <animateMotion path="M0,0 C 20,15 -15,25 0,40 C 15,55 -20,60 0,80" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="150" r="2.5">
      <animateMotion path="M0,0 C -20,10 15,20 0,35 C -15,50 20,55 0,70" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1150" cy="140" r="3">
      <animateMotion path="M0,0 C 15,-15 -20,-25 0,-40 C 15,-55 -20,-60 0,-80" dur="14s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
